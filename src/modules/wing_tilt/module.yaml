module_name: Wing Tilt
parameters:
  - group: Wing Tilt
    definitions:
      TILT_KP:
        description:
          short: Wing tilt position loop proportional gain
          long: |
            Proportional gain mapping tilt angle error [rad] to normalized ESC command [-1, 1].
        type: float
        min: 0.0
        max: 20.0
        decimal: 3
        increment: 0.01
        default: 1.8
      #may have less ss error when going back to position if you keep increasing KI along with KD
      TILT_KI:
        description:
          short: Wing tilt position loop integral gain
        type: float
        min: 0.0
        max: 20.0
        decimal: 3
        increment: 0.01
        default: 0.45

      TILT_KD:
        description:
          short: Wing tilt position loop derivative gain
        type: float
        min: 0.0
        max: 20.0
        decimal: 3
        increment: 0.01
        default: 0.11

      TILT_DB:
        description:
          short: Tilt error deadband
          long: |
            When the absolute tilt angle error is below this value the controller treats the
            error as zero to avoid ESC dither around the target.
        type: float
        unit: rad
        min: 0.0
        max: 0.2
        decimal: 3
        increment: 0.001
        default: 0.01

      TILT_ARM_V:
        description:
          short: ESC arming wiggle amplitude (sign = initial direction)
          long: |
            The controller runs a sinusoidal wiggle about neutral (amplitude |TILT_ARM_V|,
            TILT_ARM_N cycles of period TILT_ARM_T, ending at neutral) TILT_ARM_DLY seconds
            after the vehicle outputs go live (arming/prearming), and on demand via
            `wing_tilt esc_arm`. Positive swings below neutral first; negative swings above
            neutral first. Setpoints are not serviced until the wiggle completes. 0 disables it.

            The greenjay/Hydra firmware on the tilt ESC arms after ~100 pulses within its
            rc_deadzone (default +/-10 us) of its stored center, which sits slightly off our
            1500 us neutral — a steady 1500 never arms it, while a slow small wiggle dwelling
            near center does (bench-confirmed 2026-08-13: 0.1 / 2.0 s; arms in the first cycle).
        type: float
        min: -1.0
        max: 1.0
        decimal: 2
        increment: 0.05
        default: 0.1

      TILT_ARM_T:
        description:
          short: ESC arming wiggle period per cycle
        type: float
        unit: s
        min: 0.1
        max: 5.0
        decimal: 2
        increment: 0.05
        default: 2.0

      TILT_ARM_N:
        description:
          short: ESC arming wiggle cycle count
          long: |
            The ESC reliably arms during the first cycle (bench 2026-08-13); the default keeps
            one spare cycle for margin. Extra cycles after the ESC arms physically move the
            wing, which the post-wiggle recenter then has to undo.
        type: int32
        min: 1
        max: 20
        default: 2

      TILT_ARM_DLY:
        description:
          short: ESC arming sequence start delay
          long: |
            Delay from the vehicle outputs going live (arming/prearming) to the start of the ESC
            arming sequence. With prearm enabled the outputs go live seconds after battery
            plug-in, while the tilt ESC is still in its own power-on init and would miss the
            sweep; the output pin holds neutral during the delay so the ESC boots against a
            valid signal, then sees the sweep and arms.
        type: float
        unit: s
        min: 0.0
        max: 30.0
        decimal: 1
        increment: 0.5
        default: 5.0

      TILT_GEAR:
        description:
          short: Encoder-to-wing gear ratio (encoder turns per wing turn)
          long: |
            Gear reduction between the wing tilt shaft and the AS5600 encoder shaft. Set to
            (shaft gear teeth) / (encoder gear teeth). The encoder rotates this many turns per
            wing turn, so the controller divides the measured encoder angle by this ratio to
            recover the true wing angle. 1.0 = direct drive (encoder on the wing shaft).
            Example: a 25-tooth shaft gear driving a 20-tooth encoder gear -> 25/20 = 1.25.
        type: float
        min: 0.1
        max: 10.0
        decimal: 3
        increment: 0.01
        default: 1.0
        reboot_required: true
