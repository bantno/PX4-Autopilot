module_name: Wing Tilt
parameters:
  - group: Wing Tilt
    definitions:
      TILT_KP:
        description:
          short: Wing tilt position loop proportional gain
          long: |
            Proportional gain mapping tilt angle error [rad] to normalized ESC command [-1, 1].
        type: float
        min: 0.0
        max: 20.0
        decimal: 3
        increment: 0.01
        default: 1.8
      #may have less ss error when going back to position if you keep increasing KI along with KD
      TILT_KI:
        description:
          short: Wing tilt position loop integral gain
        type: float
        min: 0.0
        max: 20.0
        decimal: 3
        increment: 0.01
        default: 0.45

      TILT_KD:
        description:
          short: Wing tilt position loop derivative gain
        type: float
        min: 0.0
        max: 20.0
        decimal: 3
        increment: 0.01
        default: 0.11

      TILT_DB:
        description:
          short: Tilt error deadband
          long: |
            When the absolute tilt angle error is below this value the controller treats the
            error as zero to avoid ESC dither around the target.
        type: float
        unit: rad
        min: 0.0
        max: 0.2
        decimal: 3
        increment: 0.001
        default: 0.01

      TILT_ARM_V:
        description:
          short: ESC arming sequence command magnitude
          long: |
            The reversible tilt ESC arms only after seeing a command below neutral and then above
            neutral. The controller runs that sequence (-TILT_ARM_V for TILT_ARM_T seconds, then
            +TILT_ARM_V for TILT_ARM_T, then neutral) TILT_ARM_DLY seconds after the vehicle
            outputs go live (arming/prearming), and on demand via `wing_tilt esc_arm`. Setpoints
            are not serviced until the sequence completes. 0 disables it.
        type: float
        min: 0.0
        max: 1.0
        decimal: 2
        increment: 0.05
        default: 0.2

      TILT_ARM_T:
        description:
          short: ESC arming sequence per-phase duration
        type: float
        unit: s
        min: 0.05
        max: 2.0
        decimal: 2
        increment: 0.05
        default: 0.3

      TILT_ARM_DLY:
        description:
          short: ESC arming sequence start delay
          long: |
            Delay from the vehicle outputs going live (arming/prearming) to the start of the ESC
            arming sequence. With prearm enabled the outputs go live seconds after battery
            plug-in, while the tilt ESC is still in its own power-on init and would miss the
            sweep; the output pin holds neutral during the delay so the ESC boots against a
            valid signal, then sees the sweep and arms.
        type: float
        unit: s
        min: 0.0
        max: 30.0
        decimal: 1
        increment: 0.5
        default: 5.0

      TILT_GEAR:
        description:
          short: Encoder-to-wing gear ratio (encoder turns per wing turn)
          long: |
            Gear reduction between the wing tilt shaft and the AS5600 encoder shaft. Set to
            (shaft gear teeth) / (encoder gear teeth). The encoder rotates this many turns per
            wing turn, so the controller divides the measured encoder angle by this ratio to
            recover the true wing angle. 1.0 = direct drive (encoder on the wing shaft).
            Example: a 25-tooth shaft gear driving a 20-tooth encoder gear -> 25/20 = 1.25.
        type: float
        min: 0.1
        max: 10.0
        decimal: 3
        increment: 0.01
        default: 1.0
        reboot_required: true
