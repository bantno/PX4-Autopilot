module_name: Sun Tracker
parameters:
  - group: Sun Tracker
    definitions:
      SUN_TRK_EN:
        description:
          short: Enable the sun-tracking tilt-wing controller
        type: boolean
        default: 0
        reboot_required: true

      # The wing tilt position loop (gains, deadband, gear ratio) lives in the wing_tilt
      # controller module (TILT_* params); this module only publishes setpoints to it.

      SUN_TILT_OFF:
        description:
          short: Tilt angle residual trim
          long: |
            Small mechanical-alignment correction added to the computed desired tilt angle. The
            encoder reports tilt relative to the boot-time level reference, so this is only a
            residual trim, not the encoder zero.
        type: float
        unit: rad
        min: -0.5
        max: 0.5
        decimal: 3
        increment: 0.01
        default: 0.0

      SUN_TILT_MIN:
        description:
          short: Minimum allowed wing tilt angle (relative to boot zero)
        type: float
        unit: rad
        min: -1.5
        max: 0.0
        decimal: 3
        increment: 0.01
        default: -1.2

      SUN_TILT_MAX:
        description:
          short: Maximum allowed wing tilt angle (relative to boot zero)
        type: float
        unit: rad
        min: 0.0
        max: 1.5
        decimal: 3
        increment: 0.01
        default: 1.2

      SUN_PARK:
        description:
          short: Parked tilt angle used when the sun is below the horizon
        type: float
        unit: rad
        min: -1.5
        max: 1.5
        decimal: 3
        increment: 0.01
        default: 0.0

      SUN_AXIS:
        description:
          short: Wing tilt rotation axis (body frame)
        type: enum
        values:
          0: Body Y (pitch)
          1: Body X (roll)
        default: 0
        reboot_required: true

      SUN_TILT_REV:
        description:
          short: Reverse the commanded tilt direction
          long: |
            Negates the sun-derived tilt setpoint to reconcile the geometry convention (positive
            tilt = panel normal rotates from level toward +body-X / nose forward) with how the wing
            shaft and encoder are physically mounted. Set to 1 if the wing tilts the correct amount
            but in the opposite direction (e.g. forward when it should go backward). Does not affect
            the encoder/ESC loop sign, only which way the panel is asked to point.
        type: boolean
        default: 0

      SUN_HDG_VAR_MAX:
        description:
          short: Maximum heading variance accepted for tracking
          long: |
            Heading-quality gate. Tracking is allowed only when the estimator's heading variance
            (vehicle_local_position.heading_var) is at or below this value, i.e. yaw is aided by an
            absolute reference (magnetometer or GPS yaw) and the estimate is tight enough to point
            the panel. This intentionally does NOT use heading_good_for_control: that flag only
            becomes true after an in-flight magnetometer alignment, so it never asserts on the
            ground, whereas a sun tracker runs stationary. sqrt(value) is the 1-sigma heading error
            in rad; the 0.05 default is ~13 deg, which keeps the panel cosine loss negligible.
        type: float
        min: 0.001
        max: 0.5
        decimal: 4
        increment: 0.005
        default: 0.05

      # >>> TEMP DEBUG SWEEP (bench testing only) — remove this block and the matching
      #     code in SunTracker.cpp/.hpp once tilt-wing actuation is validated.
      SUN_DBG_SWP:
        description:
          short: "DEBUG: sweep the wing back and forth instead of tracking the sun"
          long: |
            Test-only. When enabled, ignore GPS/sun/attitude and drive the tilt setpoint as a
            sine sweep of +/-SUN_DBG_AMP about zero (still closed on the encoder, still clamped to
            SUN_TILT_MIN/MAX). Lets you verify the encoder + reversible ESC on the bench without a
            fix. Runs even if SUN_TRK_EN is 0. Remove before flight.
        type: boolean
        default: 0

      SUN_DBG_AMP:
        description:
          short: "DEBUG: sweep half-amplitude for SUN_DBG_SWP"
        type: float
        unit: deg
        min: 0.0
        max: 45.0
        decimal: 1
        increment: 1.0
        default: 10.0
      # <<< TEMP DEBUG SWEEP
