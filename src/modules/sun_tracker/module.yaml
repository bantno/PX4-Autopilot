module_name: Sun Tracker
parameters:
  - group: Sun Tracker
    definitions:
      SUN_TRK_EN:
        description:
          short: Enable the sun-tracking tilt-wing controller
        type: boolean
        default: 0
        reboot_required: true

      SUN_KP:
        description:
          short: Wing tilt position loop proportional gain
          long: |
            Proportional gain mapping tilt angle error [rad] to normalized ESC command [-1, 1].
        type: float
        min: 0.0
        max: 20.0
        decimal: 3
        increment: 0.01
        default: 2.0

      SUN_KI:
        description:
          short: Wing tilt position loop integral gain
        type: float
        min: 0.0
        max: 20.0
        decimal: 3
        increment: 0.01
        default: 0.0

      SUN_KD:
        description:
          short: Wing tilt position loop derivative gain
        type: float
        min: 0.0
        max: 20.0
        decimal: 3
        increment: 0.01
        default: 0.0

      SUN_TILT_OFF:
        description:
          short: Tilt angle residual trim
          long: |
            Small mechanical-alignment correction added to the computed desired tilt angle. The
            encoder reports tilt relative to the boot-time level reference, so this is only a
            residual trim, not the encoder zero.
        type: float
        unit: rad
        min: -0.5
        max: 0.5
        decimal: 3
        increment: 0.01
        default: 0.0

      SUN_TILT_MIN:
        description:
          short: Minimum allowed wing tilt angle (relative to boot zero)
        type: float
        unit: rad
        min: -1.5
        max: 0.0
        decimal: 3
        increment: 0.01
        default: -1.2

      SUN_TILT_MAX:
        description:
          short: Maximum allowed wing tilt angle (relative to boot zero)
        type: float
        unit: rad
        min: 0.0
        max: 1.5
        decimal: 3
        increment: 0.01
        default: 1.2

      SUN_DEADBAND:
        description:
          short: Tilt error deadband
          long: |
            When the absolute tilt angle error is below this value the controller treats the
            error as zero to avoid ESC dither around the target.
        type: float
        unit: rad
        min: 0.0
        max: 0.2
        decimal: 3
        increment: 0.001
        default: 0.01

      SUN_PARK:
        description:
          short: Parked tilt angle used when the sun is below the horizon
        type: float
        unit: rad
        min: -1.5
        max: 1.5
        decimal: 3
        increment: 0.01
        default: 0.0

      SUN_AXIS:
        description:
          short: Wing tilt rotation axis (body frame)
        type: enum
        values:
          0: Body Y (pitch)
          1: Body X (roll)
        default: 0
        reboot_required: true
