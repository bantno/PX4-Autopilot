module_name: Self Right
parameters:
  - group: Self Right
    definitions:
      SR_EN:
        description:
          short: Enable the autonomous self-righting controller
          long: |
            Starts the self_right module and exposes the SELF_RIGHT flight mode. The mode can only
            be entered while the estimator reports the aircraft inverted and at rest; see
            documentation/self_right_architecture.md.
        type: boolean
        default: 0
        reboot_required: true

      SR_INV_THR:
        description:
          short: Inverted-detection threshold on the body-up axis
          long: |
            The mode is enterable only when the body +Z axis points down in the world by at least
            this much, i.e. dcm_z(q)(2) < -SR_INV_THR. 1.0 = perfectly inverted, 0 = on its side.
        type: float
        min: 0.3
        max: 0.99
        decimal: 2
        increment: 0.05
        default: 0.7

      SR_TILT_SP:
        description:
          short: Wing tilt setpoint for props-up righting
          long: Wing angle (relative to boot-time level) that points the props up while inverted.
        type: float
        unit: rad
        min: 0.0
        max: 1.8
        decimal: 3
        increment: 0.01
        default: 1.57

      SR_TILT_PARK:
        description:
          short: Wing tilt angle to return to after the maneuver
        type: float
        unit: rad
        min: -1.8
        max: 1.8
        decimal: 3
        increment: 0.01
        default: 0.0

      SR_TILT_TOL:
        description:
          short: Wing tilt tolerance to consider the props-up setpoint reached
        type: float
        unit: rad
        min: 0.01
        max: 0.5
        decimal: 3
        increment: 0.01
        default: 0.1

      SR_TILT_TMO:
        description:
          short: Max time for the wing to reach the props-up tilt
          long: |
            If the wing has not reached SR_TILT_SP within this time the maneuver is aborted (throttle
            stays at zero, wing parks, vehicle disarms). Also bounds the wing-park phase after the
            attempt.
        type: float
        unit: s
        min: 0.5
        max: 15.0
        decimal: 1
        increment: 0.5
        default: 5.0

      # The wing tilt position loop shares the sun tracker's tune (SUN_KP/KI/KD, SUN_DEADBAND,
      # SUN_GEAR_RATIO) — same physical actuator and encoder, one set of gains for both.

      SR_THR_MAX:
        description:
          short: Peak symmetric motor throttle during righting
          long: |
            The righting law ramps to this throttle over SR_RAMP_T and holds it until cut. The
            2026-07-24 pool log shows full throttle is required: 0.56 sustained for 10 s did not
            move the airframe past 161 deg.
        type: float
        min: 0.0
        max: 1.0
        decimal: 2
        increment: 0.05
        default: 1.0

      SR_RAMP_T:
        description:
          short: Time to ramp throttle from 0 to the peak
        type: float
        unit: s
        min: 0.0
        max: 5.0
        decimal: 1
        increment: 0.1
        default: 1.0

      SR_OVERCTR:
        description:
          short: Over-center (tipping point) angle
          long: |
            Pitch-from-upright angle below which the CG is considered to have passed the unstable
            tipping point; buoyancy+gravity then settle the aircraft upright without thrust.
            From the 2026-07-24 pool log: a manual cut at ~90 deg completed cleanly, while an
            attempt that only touched ~107 deg fell back inverted — 1.4 rad (80 deg) commits with
            margin on both sides.
        type: float
        unit: rad
        min: 0.2
        max: 2.5
        decimal: 3
        increment: 0.05
        default: 1.4

      SR_TIMEOUT:
        description:
          short: Maximum righting duration before a fail-safe cut
          long: |
            If over-center is not reached within this time the throttle is cut, the wing parks and
            the vehicle disarms. The successful manual flip took ~2.7 s from throttle-up to the cut
            (2026-07-24 pool log); 5 s is that with ~2x margin.
        type: float
        unit: s
        min: 1.0
        max: 30.0
        decimal: 1
        increment: 0.5
        default: 5.0

      SR_STICK_DZ:
        description:
          short: Manual stick deadzone for pilot override
          long: |
            Any roll/pitch/yaw stick beyond this magnitude aborts the maneuver: throttle cut, wing
            parked, vehicle disarmed.
        type: float
        min: 0.05
        max: 0.9
        decimal: 2
        increment: 0.05
        default: 0.15
