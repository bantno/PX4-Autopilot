module_name: Self Right
parameters:
  - group: Self Right
    definitions:
      SR_EN:
        description:
          short: Enable the autonomous self-righting controller
          long: |
            Starts the self_right module and exposes the SELF_RIGHT flight mode. The mode can only
            be entered while the estimator reports the aircraft inverted and at rest; see
            .CLAUDE/self_right_architecture.md.
        type: boolean
        default: 0
        reboot_required: true

      SR_STRATEGY:
        description:
          short: Righting control law
        type: enum
        values:
          0: Open-loop replay (recorded thrust trajectory)
          1: Attitude PID (close on pitch-from-upright)
        default: 1

      SR_INV_THR:
        description:
          short: Inverted-detection threshold on the body-up axis
          long: |
            The mode is enterable only when the body +Z axis points down in the world by at least
            this much, i.e. dcm_z(q)(2) < -SR_INV_THR. 1.0 = perfectly inverted, 0 = on its side.
        type: float
        min: 0.3
        max: 0.99
        decimal: 2
        increment: 0.05
        default: 0.7

      SR_TILT_SP:
        description:
          short: Wing tilt setpoint for props-up righting
          long: Wing angle (relative to boot-time level) that points the props up while inverted.
        type: float
        unit: rad
        min: 0.0
        max: 1.8
        decimal: 3
        increment: 0.01
        default: 1.57

      SR_TILT_PARK:
        description:
          short: Wing tilt angle to return to after the maneuver
        type: float
        unit: rad
        min: -1.8
        max: 1.8
        decimal: 3
        increment: 0.01
        default: 0.0

      SR_TILT_TOL:
        description:
          short: Wing tilt tolerance to consider the props-up setpoint reached
        type: float
        unit: rad
        min: 0.01
        max: 0.5
        decimal: 3
        increment: 0.01
        default: 0.1

      SR_TILT_TMO:
        description:
          short: Max time to reach the props-up tilt before proceeding anyway
        type: float
        unit: s
        min: 0.5
        max: 15.0
        decimal: 1
        increment: 0.5
        default: 5.0

      SR_KP:
        description:
          short: Wing tilt position loop proportional gain
        type: float
        min: 0.0
        max: 20.0
        decimal: 3
        increment: 0.01
        default: 2.0

      SR_KI:
        description:
          short: Wing tilt position loop integral gain
        type: float
        min: 0.0
        max: 20.0
        decimal: 3
        increment: 0.01
        default: 0.0

      SR_KD:
        description:
          short: Wing tilt position loop derivative gain
        type: float
        min: 0.0
        max: 20.0
        decimal: 3
        increment: 0.01
        default: 0.0

      SR_THR_MAX:
        description:
          short: Maximum (hard ceiling) symmetric motor throttle during righting
        type: float
        min: 0.0
        max: 1.0
        decimal: 2
        increment: 0.05
        default: 0.9

      SR_RAMP_T:
        description:
          short: Time to ramp throttle from 0 to the peak
        type: float
        unit: s
        min: 0.0
        max: 5.0
        decimal: 1
        increment: 0.1
        default: 1.0

      SR_OVERCTR:
        description:
          short: Over-center (tipping point) angle
          long: |
            Pitch-from-upright angle below which the CG is considered to have passed the unstable
            tipping point; buoyancy+gravity then settle the aircraft upright without thrust.
        type: float
        unit: rad
        min: 0.2
        max: 2.5
        decimal: 3
        increment: 0.05
        default: 1.2

      SR_TIMEOUT:
        description:
          short: Maximum righting duration before a fail-safe cut
          long: Backstop. Also the per-attempt failure trigger for the adaptive thrust search.
        type: float
        unit: s
        min: 1.0
        max: 30.0
        decimal: 1
        increment: 0.5
        default: 6.0

      SR_PID_P:
        description:
          short: Attitude-PID strategy proportional gain (pitch error -> throttle)
        type: float
        min: 0.0
        max: 10.0
        decimal: 3
        increment: 0.01
        default: 0.6

      SR_PID_I:
        description:
          short: Attitude-PID strategy integral gain
        type: float
        min: 0.0
        max: 10.0
        decimal: 3
        increment: 0.01
        default: 0.1

      SR_PID_D:
        description:
          short: Attitude-PID strategy derivative gain
        type: float
        min: 0.0
        max: 10.0
        decimal: 3
        increment: 0.01
        default: 0.05

      SR_ADAPT_EN:
        description:
          short: Enable adaptive (iterative-learning) thrust search
          long: |
            Across attempts, start at SR_THR_INIT and step up by SR_THR_STEP on each failed
            (no over-center) attempt until the flip succeeds, capped at SR_THR_MAX. Wraps the
            open-loop / ramp law. Has no effect on the attitude-PID strategy.
        type: boolean
        default: 0

      SR_THR_INIT:
        description:
          short: Initial (conservative) peak throttle for the adaptive search
        type: float
        min: 0.0
        max: 1.0
        decimal: 2
        increment: 0.05
        default: 0.5

      SR_THR_STEP:
        description:
          short: Throttle increment per failed adaptive attempt
        type: float
        min: 0.01
        max: 0.5
        decimal: 2
        increment: 0.01
        default: 0.05

      SR_THR_LRN:
        description:
          short: Learned peak throttle (persisted by the adaptive search)
          long: Updated at runtime by the adaptive search; seed equals SR_THR_INIT on first use.
        type: float
        min: 0.0
        max: 1.0
        decimal: 2
        increment: 0.05
        default: 0.5

      SR_STICK_DZ:
        description:
          short: Manual stick deadzone for pilot override
          long: Any roll/pitch/yaw stick beyond this magnitude aborts the maneuver to MANUAL.
        type: float
        min: 0.05
        max: 0.9
        decimal: 2
        increment: 0.05
        default: 0.15

      SR_RNG_MIN:
        description:
          short: Minimum downward rangefinder clearance before a reflex cut
          long: |
            If a downward distance_sensor reports clearance below this, the maneuver cuts throttle
            immediately (props approaching water). 0 disables the rangefinder backstop.
        type: float
        unit: m
        min: 0.0
        max: 5.0
        decimal: 2
        increment: 0.05
        default: 0.0
